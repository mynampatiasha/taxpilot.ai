services:
  - type: web
    name: taxpilot-sync
    runtime: node
    plan: free
    buildCommand: cd functions && npm install
    startCommand: cd functions && node server.js
    envVars:
      - key: SOURCE_MONGO_URI
        sync: false
      - key: SERVICE_ACCOUNT_KEY_JSON
        sync: false
      - key: TAXPILOT_API_KEY
        sync: false
