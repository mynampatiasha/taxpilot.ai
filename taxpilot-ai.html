html,body{margin:0;height:100%}

<!-- Firestore security rules: copy from the Setup page (or from here) into Firebase Console → Firestore Database → Rules → Publish -->
<script type="text/plain" id="fs-rules">rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {

    function signedIn() { return request.auth != null; }
    function uid() { return request.auth.uid; }
    function email() { return request.auth.token.email; }
    function changed() { return request.resource.data.diff(resource.data).affectedKeys(); }

    match /users/{userId} {
      allow read, create, update: if signedIn() && uid() == userId;
      allow delete: if false;
    }

    match /businesses/{bid} {
      function bizData() { return get(/databases/$(database)/documents/businesses/$(bid)).data; }
      function member() { return signedIn() && uid() in bizData().memberIds; }
      function hasRole(rs) { return member() && bizData().roles[uid()] in rs; }
      function periodOpen(p) {
        let path = /databases/$(database)/documents/businesses/$(bid)/periods/$(p);
        return p is string && p.matches('^[0-9]{4}-[0-9]{2}$')
          && (!exists(path) || get(path).data.status == 'OPEN');
      }

      allow read: if signedIn() && (uid() in resource.data.memberIds || email() in resource.data.inviteEmails);

      allow create: if signedIn()
        && request.resource.data.createdBy == uid()
        && request.resource.data.memberIds == [uid()]
        && request.resource.data.roles.keys().hasOnly([uid()])
        && request.resource.data.roles[uid()] == 'OWNER'
        && request.resource.data.inviteEmails.size() == 0
        && request.resource.data.invites.size() == 0
        && request.resource.data.name is string && request.resource.data.name.size() > 0
        && request.resource.data.gstin is string && request.resource.data.gstin.size() == 15;

      allow update: if signedIn() && (
        // profile edits by owner / admin
        (uid() in resource.data.memberIds && resource.data.roles[uid()] in ['OWNER', 'ADMIN']
          && !changed().hasAny(['memberIds', 'roles', 'memberInfo', 'invites', 'inviteEmails', 'createdBy', 'createdAt']))
        ||
        // team management by owner; the owner must remain an owner
        (uid() in resource.data.memberIds && resource.data.roles[uid()] == 'OWNER'
          && changed().hasOnly(['memberIds', 'roles', 'memberInfo', 'invites', 'inviteEmails', 'updatedAt'])
          && uid() in request.resource.data.memberIds
          && request.resource.data.roles[uid()] == 'OWNER'
          && request.resource.data.roles.keys().toSet() == request.resource.data.memberIds.toSet()
          && request.resource.data.inviteEmails.toSet() == request.resource.data.invites.keys().toSet())
        ||
        // accept an invitation (verified email only)
        (request.auth.token.email_verified == true
          && email() in resource.data.inviteEmails
          && !(uid() in resource.data.memberIds)
          && changed().hasOnly(['memberIds', 'roles', 'memberInfo', 'invites', 'inviteEmails', 'updatedAt'])
          && request.resource.data.memberIds.toSet() == resource.data.memberIds.toSet().union([uid()].toSet())
          && request.resource.data.roles.diff(resource.data.roles).affectedKeys().hasOnly([uid()])
          && request.resource.data.roles[uid()] == resource.data.invites[email()]
          && request.resource.data.memberInfo.diff(resource.data.memberInfo).affectedKeys().hasOnly([uid()])
          && request.resource.data.invites.diff(resource.data.invites).affectedKeys().hasOnly([email()])
          && !(email() in request.resource.data.invites)
          && request.resource.data.inviteEmails.toSet() == resource.data.inviteEmails.toSet().difference([email()].toSet()))
        ||
        // decline an invitation
        (email() in resource.data.inviteEmails
          && changed().hasOnly(['invites', 'inviteEmails', 'updatedAt'])
          && request.resource.data.invites.diff(resource.data.invites).affectedKeys().hasOnly([email()])
          && !(email() in request.resource.data.invites)
          && request.resource.data.inviteEmails.toSet() == resource.data.inviteEmails.toSet().difference([email()].toSet()))
      );
      allow delete: if false;

      match /invoices/{invId} {
        allow read: if member();
        allow create: if hasRole(['OWNER', 'ADMIN', 'ACCOUNTANT'])
          && request.resource.data.type in ['SALE', 'PURCHASE']
          && periodOpen(request.resource.data.period);
        allow update: if hasRole(['OWNER', 'ADMIN', 'ACCOUNTANT'])
          && periodOpen(resource.data.period) && periodOpen(request.resource.data.period);
        allow delete: if hasRole(['OWNER', 'ADMIN', 'ACCOUNTANT']) && periodOpen(resource.data.period);
      }

      match /payments/{invId} {
        allow read: if member();
        allow write: if hasRole(['OWNER', 'ADMIN', 'ACCOUNTANT']);
      }

      match /issues/{issueId} {
        allow read: if member();
        allow create, update: if hasRole(['OWNER', 'ADMIN', 'ACCOUNTANT', 'CA']);
        allow delete: if false;
      }

      match /gstr2b/{rowId} {
        allow read: if member();
        allow write: if hasRole(['OWNER', 'ADMIN', 'ACCOUNTANT']);
      }

      match /periods/{p} {
        allow read: if member();
        allow create: if p.matches('^[0-9]{4}-[0-9]{2}$') && request.resource.data.status == 'APPROVED'
          && hasRole(['OWNER', 'CA']);
        allow update: if p.matches('^[0-9]{4}-[0-9]{2}$') && (
          (resource.data.status == 'OPEN' && request.resource.data.status == 'APPROVED' && hasRole(['OWNER', 'CA']))
          || (resource.data.status == 'APPROVED' && request.resource.data.status == 'FILED' && hasRole(['OWNER', 'CA']))
          || (resource.data.status == 'APPROVED' && request.resource.data.status == 'OPEN' && hasRole(['OWNER'])));
        allow delete: if false;
      }

      match /aiConversations/{convId} {
        allow read, delete: if member() && resource.data.userId == uid();
        allow create: if member() && request.resource.data.userId == uid();
        allow update: if member() && resource.data.userId == uid() && request.resource.data.userId == uid();
      }

      match /auditLogs/{logId} {
        allow read: if member();
        allow create: if member() && request.resource.data.userId == uid()
          && request.resource.data.timestamp == request.time;
        allow update, delete: if false;
      }
    }
  }
}
</script>

const AI_MODEL = 'gemini-3.8-flash'; // change here if Google retires this model

}

async function aiAsk(q) {

  const ctxKey = `${S.fy}|${S.period}|${S.invoices.length}|${S.issues.length}`;
  if (S.chat.ctxKey !== ctxKey) { S.chat.session = null; S.chat.ctxKey = ctxKey; }
  const prior = S.chat.messages.filter(m => !m.error).map(m => ({ role: m.role === 'user' ? 'user' : 'model', parts: [{ text: m.text }] }));
  S.chat.messages.push({ role: 'user', text: q }); S.chat.busy = true; render(); scrollChat();
  try {
    if (!S.chat.session) {
      const { model } = await aiModel({ systemInstruction: `You are TaxPilot AI, a GST compliance assistant for an Indian business. For anything about this business's numbers, invoices, issues or returns, answer ONLY from the JSON data below, which was produced by TaxPilot's deterministic GST rules engine.
- For general GST concept questions (e.g. what GSTR-3B is, what reverse charge means), explain briefly in simple English, and relate it to this business's data where useful.
- Never invent invoices or amounts. Do not recalculate tax differently from the data; explain the figures given.
- Use Indian Rupees (₹) with Indian digit grouping. Mention invoice numbers when relevant.
- If the data does not contain the answer, say so and suggest where in TaxPilot to look.
- Keep answers short and practical. Plain text, no markdown tables.
- You are not a substitute for a Chartered Accountant; for legal interpretation suggest confirming with a CA.
DATA:
${JSON.stringify(aiContext())}` });
      S.chat.session = model.startChat({ history: prior });
    }
    // stream the answer so text appears as it is generated
    const r = await withTimeout(S.chat.session.sendMessageStream(q), 60000, 'The AI did not respond within 60 seconds. Please try again.');
    const msg = { role: 'model', text: '' }; S.chat.messages.push(msg);
    for await (const chunk of r.stream) {
      msg.text += chunk.text();
      if (route() === 'assistant') { S.chat.busy = false; render(); S.chat.busy = true; scrollChat(); }
    }
    if (!msg.text.trim()) msg.text = (await r.response).text() || 'No answer was returned. Please rephrase the question.';
  } catch (e) {
    console.error(e);
    const last = S.chat.messages[S.chat.messages.length - 1];
    if (last?.role === 'model' && !last.text) S.chat.messages.pop();
    S.chat.messages.push({ role: 'model', text: aiFriendly(e), error: true }); S.chat.session = null;
  }

}

const sgn = inv => (inv.docType === 'CREDIT_NOTE' ? -1 : 1);

const reconKey = (docType, gstin, no) => `${docType || 'INVOICE'}|${gstin}|${normNo(no)}`;

function resolveStates(inv, biz) {
  const party = validateGSTIN(inv.partyGSTIN);
  let supplier, pos;
  if (inv.type === 'SALE') { supplier = biz.stateCode; pos = inv.placeOfSupply || (party.ok ? party.stateCode : biz.stateCode); }
  else { supplier = party.ok ? party.stateCode : (inv.supplierState || biz.stateCode); pos = inv.placeOfSupply || biz.stateCode; }

function evaluateInvoice(inv, ctx) {
  const { biz } = ctx; const isSale = inv.type === 'SALE'; const isComp = biz.registrationType === 'COMPOSITION';

    const ex = issues.find(i => i.code === code);

  };
  const st = resolveStates(inv, biz);
  const date = inv.invoiceDate || ctx.today;

  const lines = (inv.lines || []).map(l => {
    const taxable = round2(num(l.taxableValue)); const rate = num(l.gstRate);

    return { description: l.description || '', hsn: String(l.hsn || '').trim(), qty: num(l.qty), unitPrice: num(l.unitPrice),
      taxableValue: taxable, gstRate: rate, cgst, sgst, igst, cess: round2(num(l.cess)), declared: l.declared || null };
  });
  const t = lines.reduce((a, l) => { for (const k of ['taxableValue', 'cgst', 'sgst', 'igst', 'cess']) a[k] += l[k]; return a; }, { taxableValue: 0, cgst: 0, sgst: 0, igst: 0, cess: 0 });
  for (const k in t) t[k] = round2(t[k]);

  t.totalAmount = round2(t.taxableValue + t.totalTax);

  if (!inv.invoiceNumber) add('MISSING_INVOICE_NUMBER', 'HIGH', 'Invoice number is missing.');
  else if (String(inv.invoiceNumber).length > 16 || !/^[A-Za-z0-9\/-]+$/.test(inv.invoiceNumber))
    add('INVALID_INVOICE_NUMBER', 'MEDIUM', 'Invoice number should be at most 16 characters using only letters, digits, "/" and "-" (Rule 46).');
  if (!inv.invoiceDate) add('MISSING_DATE', 'HIGH', 'Invoice date is missing.');
  else if (inv.invoiceDate > ctx.today) add('FUTURE_DATE', 'HIGH', 'Invoice date is in the future.');
  if (!String(inv.partyName || '').trim()) add('MISSING_PARTY', 'MEDIUM', `${isSale ? 'Customer' : 'Supplier'} name is missing.`);
  if (inv.partyGSTIN) {
    if (!st.party.ok) add('INVALID_GSTIN', 'HIGH', `${isSale ? 'Customer' : 'Supplier'} GSTIN ${inv.partyGSTIN}: ${st.party.error}.`);
    else if (st.party.gstin === biz.gstin) add('OWN_GSTIN', 'HIGH', 'Party GSTIN is the same as your own GSTIN.');
  } else if (!isSale && !inv.reverseCharge) add('MISSING_SUPPLIER_GSTIN', 'MEDIUM', 'Supplier GSTIN is missing — ITC cannot be claimed without it.');
  if ((inv.docType === 'CREDIT_NOTE' || inv.docType === 'DEBIT_NOTE') && !inv.originalInvoiceNumber)
    add('MISSING_ORIGINAL_INVOICE', 'LOW', 'Original invoice number is not recorded for this note.');
  if (!lines.length) add('NO_LINES', 'HIGH', 'Invoice has no line items.');
  if (isSale && isComp && lines.some(l => l.gstRate > 0))
    add('COMPOSITION_TAX', 'HIGH', 'Composition taxpayers cannot collect GST — issue a Bill of Supply with 0% tax.');

  // --- line validations
  const slab = rateSlab(date);
  lines.forEach((l, i) => {
    const n = `Line ${i + 1}:`;
    if (l.taxableValue <= 0) add('ZERO_VALUE', 'HIGH', `${n} taxable value must be greater than zero.`);
    if (!slab.rates.includes(l.gstRate)) add('INVALID_RATE', 'HIGH', `${n} ${l.gstRate}% is not a valid GST rate on ${fmtDate(date)}.`);
    else if (slab.reviewRates.includes(l.gstRate)) add('RATE_REVIEW', 'MEDIUM', `${n} the ${l.gstRate}% slab was withdrawn for most goods from 22-09-2025 — verify the rate for HSN ${l.hsn || '(not given)'}.`);
    if (!l.hsn) add('HSN_MISSING', 'LOW', `${n} HSN/SAC code missing.`);
    else if (!/^\d{4,8}$/.test(l.hsn)) add('HSN_FORMAT', 'LOW', `${n} HSN/SAC "${l.hsn}" should be 4–8 digits.`);
    if (l.qty > 0 && l.unitPrice > 0 && Math.abs(round2(l.qty * l.unitPrice) - l.taxableValue) > 1)
      add('VALUE_CHECK', 'LOW', `${n} taxable value ${inr(l.taxableValue)} differs from qty × price ${inr(l.qty * l.unitPrice)} (discount?).`);
    if (l.declared) {

      else if (!st.inter && dI > 0) add('TAX_TYPE_MISMATCH', 'HIGH', `${n} IGST charged on an intra-state supply (CGST + SGST apply).`);

    const dup = ctx.invoices.find(o => o.id !== inv.id && o.type === inv.type && (o.docType || 'INVOICE') === (inv.docType || 'INVOICE')

      if (row) {
        const rowTax = round2(num(row.igst) + num(row.cgst) + num(row.sgst));
        recon = { taxableValue: num(row.taxableValue), tax: rowTax, period: row.period };
        const ok = Math.abs(rowTax - bookTax) <= 1 && Math.abs(num(row.taxableValue) - t.taxableValue) <= 1;

    const claimed = ['APPROVED', 'FILED'].includes(ctx.periods[inv.period]?.status);
    const deadline = inv.invoiceDate ? itcDeadline(fyOf(inv.invoiceDate)) : null;
    const hasDup = issues.some(i => i.code === 'DUPLICATE_INVOICE');

    if (isComp) { itcStatus = 'NOT_ELIGIBLE'; itcReason = 'Composition taxpayers cannot claim ITC.'; }
    else if (inv.itcCategory === 'PERSONAL') { itcStatus = 'NOT_ELIGIBLE'; itcReason = 'Not used for business.'; }
    else if (inv.itcCategory === 'BLOCKED') { itcStatus = 'BLOCKED'; itcReason = 'Blocked credit under Section 17(5).'; }
    else if (!inv.reverseCharge && !st.party.ok) { itcStatus = 'NOT_ELIGIBLE'; itcReason = 'A valid supplier GSTIN is required.'; }

    else if (inv.reverseCharge) { itcStatus = 'ELIGIBLE'; itcReason = 'Reverse charge — claim after paying the tax in cash.'; }

function evalSig(ev) {
  return hash(JSON.stringify([ev.totals, ev.placeOfSupply, ev.status, ev.itcStatus, ev.itcReason, ev.reconStatus, ev.issues.map(i => i.code + i.severity + i.description)]));
}

function engineCtx(extra = {}) {
  const twoB = new Map(); const twoBPeriods = new Set();
  for (const r of S.gstr2b) { twoB.set(reconKey(r.docType, r.supplierGSTIN, r.invoiceNumber), r); twoBPeriods.add(r.period); }
  return { biz: S.biz, invoices: [...S.invoices], twoB, twoBPeriods, periods: S.periods, payments: { ...S.payments }, today: todayISO(), ...extra };
}

/* ---------- ITC set-off (IGST credit first, CGST↛SGST) ---------- */
function setOff(liab, credit) {
  const L = { ...liab }, C = { ...credit }, used = [];
  const use = (c, l) => { const a = round2(Math.min(C[c], L[l])); if (a > 0) { C[c] = round2(C[c] - a); L[l] = round2(L[l] - a); used.push({ from: c, to: l, amount: a }); } };
  use('igst', 'igst'); use('igst', 'cgst'); use('igst', 'sgst');
  use('cgst', 'cgst'); use('cgst', 'igst');
  use('sgst', 'sgst'); use('sgst', 'igst');
  use('cess', 'cess');
  return { cash: L, carryForward: C, used };
}

const zero = () => ({ taxableValue: 0, igst: 0, cgst: 0, sgst: 0, cess: 0 });
const acc = (a, t, s = 1) => { for (const k of ['taxableValue', 'igst', 'cgst', 'sgst', 'cess']) a[k] = round2(a[k] + s * (t[k] || 0)); return a; };
const pos0 = o => { const r = {}; for (const k in o) r[k] = Math.max(0, o[k]); return r; };

function gstr3b(period) {
  const r = { o31a: zero(), o31b: zero(), o31c: zero(), o31d: zero(), itcRcm: zero(), itcOther: zero(), itcPending: zero(), itcBlocked: zero(), itcNotEligible: zero(), rule37: zero() };
  for (const inv of S.invoices) {
    const ev = S.evals.get(inv.id); if (!ev) continue; const s = sgn(inv);
    if (inv.period === period && inv.type === 'SALE') {
      if (inv.reverseCharge) continue; // tax payable by recipient
      for (const l of ev.lines) {
        if (l.gstRate === 0) acc(r.o31c, { taxableValue: l.taxableValue }, s);
        else acc(r.o31a, l, s);
      }
    }
    if (inv.period === period && inv.type === 'PURCHASE') {
      if (inv.reverseCharge) acc(r.o31d, ev.totals, s);
      const bucket = { ELIGIBLE: inv.reverseCharge ? r.itcRcm : r.itcOther, POTENTIALLY_ELIGIBLE: r.itcPending, NEEDS_REVIEW: r.itcPending, MISMATCH: r.itcPending, BLOCKED: r.itcBlocked, NOT_ELIGIBLE: r.itcNotEligible }[ev.itcStatus];
      if (bucket) acc(bucket, ev.totals, s);
    }
    // Rule 37: ITC claimed in an approved/filed period whose supplier was not paid within 180 days
    // is reversed once, in the return for the month in which the 180 days expire.
    if (inv.type === 'PURCHASE' && inv.invoiceDate && inv.itcStatus === 'ELIGIBLE' && !inv.reverseCharge
      && ['APPROVED', 'FILED'].includes(S.periods[inv.period]?.status)) {
      const due = addDays(inv.invoiceDate, 180); const first = addDays(due, 1); const pay = S.payments[inv.id];
      const paidInTime = pay?.status === 'PAID' && pay.paidDate && pay.paidDate <= due;
      if (!paidInTime && first.slice(0, 7) === period && first <= todayISO()) acc(r.rule37, ev.totals, s);
    }
  }
  const itcTotal = acc(acc(zero(), r.itcRcm), r.itcOther);
  const netItc = pos0(acc({ ...itcTotal }, r.rule37, -1));
  const liability = pos0({ igst: r.o31a.igst, cgst: r.o31a.cgst, sgst: r.o31a.sgst, cess: r.o31a.cess });
  const so = setOff(liability, { igst: netItc.igst, cgst: netItc.cgst, sgst: netItc.sgst, cess: netItc.cess });
  const rcmCash = pos0({ igst: r.o31d.igst, cgst: r.o31d.cgst, sgst: r.o31d.sgst, cess: r.o31d.cess });
  const cash = {}; for (const k of ['igst', 'cgst', 'sgst', 'cess']) cash[k] = round2(so.cash[k] + rcmCash[k]);
  cash.total = round2(cash.igst + cash.cgst + cash.sgst + cash.cess);
  const outputTax = round2(r.o31a.igst + r.o31a.cgst + r.o31a.sgst + r.o31a.cess);
  const itcSum = round2(netItc.igst + netItc.cgst + netItc.sgst + netItc.cess);
  return { ...r, itcTotal, netItc, liability, setOff: so, rcmCash, cash, outputTax, itcSum };
}

/* =====================================================================
   GSTR-1 GOVERNMENT-FORMAT JSON — for real upload via the GST portal's own
   "Returns Offline Tool" (gst.gov.in), NOT the same as the "Export JSON"
   button below, which is TaxPilot's own summary for your own reference only.
   Field names (ctin, inv, inum, idt, val, pos, rchrg, inv_typ, itms, itm_det,
   txval/rt/iamt/camt/samt/csamt, b2cs's sply_ty/pos/typ/rt, cdnr's ntty/
   nt_num/nt_dt) verified against GSTN's published schema and GSP technical
   docs. B2B/B2CL/B2CS/CDNR/CDNUR are built directly from each invoice's own
   evaluated line items (S.evals), grouped by GST rate per invoice — the
   internal gstr1() below only keeps one aggregate total per invoice, which
   loses per-rate detail whenever an invoice mixes multiple GST rates.
   IMPORTANT: run the exported file through the portal's own offline tool
   validation before relying on it for an actual filing — this hasn't been
   tested against a live upload, only built from documented field specs. */
function buildGstr1GovtJson(period) {
  const sales = S.invoices.filter(i => i.type === 'SALE' && i.period === period);
  const b2bMap = new Map();    // ctin -> [{ inum, idt, val, pos, rchrg, inv_typ, itms }]
  const b2cl = [];
  const b2csMap = new Map();   // pos|rate -> aggregate row
  const cdnrMap = new Map();   // ctin -> [{ ntty, nt_num, nt_dt, val, pos, itms }]
  const cdnur = [];
  const hsnMap = new Map();    // hsn|rate -> aggregate row
  let docCount = 0;

  const itemsByRate = (lines) => {
    const byRate = new Map();
    for (const l of lines) {
      const acc = byRate.get(l.gstRate) || { txval: 0, iamt: 0, camt: 0, samt: 0, csamt: 0 };
      acc.txval += l.taxableValue; acc.iamt += l.igst; acc.camt += l.cgst; acc.samt += l.sgst; acc.csamt += l.cess;
      byRate.set(l.gstRate, acc);
    }
    let n = 1;
    return [...byRate.entries()].map(([rt, t]) => ({
      num: n++, itm_det: { rt, txval: round2(t.txval), iamt: round2(t.iamt), camt: round2(t.camt), samt: round2(t.samt), csamt: round2(t.csamt) }
    }));
  };

  for (const inv of sales) {
    const ev = S.evals.get(inv.id); if (!ev) continue;
    const party = validateGSTIN(inv.partyGSTIN);
    const reg = party.ok;
    docCount++;
    const itms = itemsByRate(ev.lines);
    const idtGov = fmtDate(inv.invoiceDate); // already DD-MM-YYYY

    if (inv.docType === 'INVOICE') {
      const invEntry = { inum: inv.invoiceNumber, idt: idtGov, val: round2(ev.totals.totalAmount), pos: ev.placeOfSupply, rchrg: inv.reverseCharge ? 'Y' : 'N', inv_typ: 'R', itms };
      if (reg) {
        if (!b2bMap.has(party.gstin)) b2bMap.set(party.gstin, []);
        b2bMap.get(party.gstin).push(invEntry);
      } else if (ev.interState && ev.totals.totalAmount > B2CL_LIMIT) {
        b2cl.push({ ...invEntry, etin: '' });
      } else {
        for (const l of ev.lines) {
          if (l.gstRate === 0) continue;
          const k = `${ev.placeOfSupply}|${l.gstRate}`;
          const row = b2csMap.get(k) || { sply_ty: ev.interState ? 'INTER' : 'INTRA', pos: ev.placeOfSupply, typ: 'OE', rt: l.gstRate, txval: 0, iamt: 0, camt: 0, samt: 0, csamt: 0 };
          row.txval += l.taxableValue;
          if (ev.interState) row.iamt += l.igst; else { row.camt += l.cgst; row.samt += l.sgst; }
          row.csamt += l.cess;
          b2csMap.set(k, row);
        }
      }
    } else {
      const noteEntry = { ntty: inv.docType === 'CREDIT_NOTE' ? 'C' : 'D', nt_num: inv.invoiceNumber, nt_dt: idtGov, val: round2(ev.totals.totalAmount), pos: ev.placeOfSupply, rchrg: inv.reverseCharge ? 'Y' : 'N', inv_typ: 'R', itms };
      if (reg) {
        if (!cdnrMap.has(party.gstin)) cdnrMap.set(party.gstin, []);
        cdnrMap.get(party.gstin).push(noteEntry);
      } else {
        cdnur.push(noteEntry);
      }
    }

    for (const l of ev.lines) {
      const k = `${l.hsn || 'NA'}|${l.gstRate}`;
      const h = hsnMap.get(k) || { num: hsnMap.size + 1, hsn_sc: l.hsn || '', desc: l.description || '', uqc: 'OTH-OTHERS', qty: 0, rt: l.gstRate, txval: 0, iamt: 0, camt: 0, samt: 0, csamt: 0 };
      h.qty += l.qty; h.txval += l.taxableValue; h.iamt += l.igst; h.camt += l.cgst; h.samt += l.sgst; h.csamt += l.cess;
      hsnMap.set(k, h);
    }
  }

  const b2b = [...b2bMap.entries()].map(([ctin, inv]) => ({ ctin, inv }));
  const cdnr = [...cdnrMap.entries()].map(([ctin, nt]) => ({ ctin, nt }));
  const b2cs = [...b2csMap.values()].map(r => ({ ...r, txval: round2(r.txval), iamt: round2(r.iamt), camt: round2(r.camt), samt: round2(r.samt), csamt: round2(r.csamt) }));
  const hsn = { data: [...hsnMap.values()].map(h => ({ ...h, qty: round2(h.qty), txval: round2(h.txval), iamt: round2(h.iamt), camt: round2(h.camt), samt: round2(h.samt), csamt: round2(h.csamt) })) };

  const [y, m] = period.split('-');
  const fp = `${m}${y}`; // MMYYYY, e.g. "082026" for 2026-08

  return { gstin: S.biz.gstin, fp, version: 'GST3.2.3', hash: 'hash', b2b, b2cl, b2cs, cdnr, cdnur, hsn };
}

function gstr1(period) {
  const sales = S.invoices.filter(i => i.type === 'SALE' && i.period === period);
  const out = { b2b: [], b2cl: [], b2cs: {}, cdnr: [], cdnur: [], nil: 0, hsn: {}, docs: { count: 0, numbers: [] } };
  for (const inv of sales) {
    const ev = S.evals.get(inv.id); if (!ev) continue; const s = sgn(inv);
    const reg = validateGSTIN(inv.partyGSTIN).ok;
    const row = { invoiceNumber: inv.invoiceNumber, invoiceDate: inv.invoiceDate, partyName: inv.partyName, partyGSTIN: inv.partyGSTIN, pos: ev.placeOfSupply, reverseCharge: !!inv.reverseCharge, ...ev.totals };
    out.docs.count++; out.docs.numbers.push(inv.invoiceNumber);
    if (inv.docType === 'INVOICE') {
      if (reg) out.b2b.push(row);
      else if (ev.interState && ev.totals.totalAmount > B2CL_LIMIT) out.b2cl.push(row);
      else for (const l of ev.lines) { if (l.gstRate === 0) continue; const k = `${ev.placeOfSupply}|${l.gstRate}`; out.b2cs[k] = acc(out.b2cs[k] || { ...zero(), pos: ev.placeOfSupply, rate: l.gstRate }, l); }
    } else (reg ? out.cdnr : out.cdnur).push({ ...row, docType: inv.docType, originalInvoiceNumber: inv.originalInvoiceNumber || '' });
    for (const l of ev.lines) {
      if (l.gstRate === 0) out.nil = round2(out.nil + s * l.taxableValue);
      const k = `${l.hsn || 'NA'}|${l.gstRate}`;
      const h = out.hsn[k] || (out.hsn[k] = { hsn: l.hsn || '—', rate: l.gstRate, qty: 0, ...zero() });
      h.qty = round2(h.qty + s * l.qty); acc(h, l, s);
    }
  }
  return out;
}

function dueDates(period) {
  const b = S.biz; const nm = nextMonth(period); const m = +period.slice(5, 7);
  if (b.registrationType === 'COMPOSITION') {
    const qEnd = [6, 9, 12, 3].includes(m);
    return qEnd ? [{ form: 'CMP-08', date: `${nm}-18` }] : [];
  }
  if (b.filingFrequency === 'QUARTERLY') {
    const qEnd = [6, 9, 12, 3].includes(m);
    if (!qEnd) return [{ form: 'PMT-06 (tax payment)', date: `${nm}-25` }];
    return [{ form: 'GSTR-1 (QRMP)', date: `${nm}-13` }, { form: 'GSTR-3B (QRMP)', date: `${nm}-${QRMP_22.includes(b.stateCode) ? 22 : 24}` }];
  }
  return [{ form: 'GSTR-1', date: `${nm}-11` }, { form: 'GSTR-3B', date: `${nm}-20` }];
}

class Batcher { // splits large writes into several committed batches
  constructor() { this.b = writeBatch(db); this.n = 0; this.all = []; }
  op(fn) { fn(this.b); this.n++; if (this.n >= 400) this.flush(); }
  flush() { if (this.n) { this.all.push(this.b.commit()); this.b = writeBatch(db); this.n = 0; } }
  async commit() { this.flush(); await Promise.all(this.all); }
}

function subscribe() {
  S.loaded = {};

    err => {

  on('issues', query(bizCol('issues'), where('fy', '==', S.fy)), s => { S.issues = s.docs.map(d => ({ id: d.id, ...d.data() })); });
  on('periods', bizCol('periods'), s => { S.periods = {}; s.docs.forEach(d => { S.periods[d.id] = { id: d.id, ...d.data() }; }); });
  on('gstr2b', query(bizCol('gstr2b'), where('fy', '==', S.fy)), s => { S.gstr2b = s.docs.map(d => ({ id: d.id, ...d.data() })); });
  on('payments', query(bizCol('payments'), where('fy', '==', S.fy)), s => { S.payments = {}; s.docs.forEach(d => { S.payments[d.id] = d.data(); }); });
  on('audit', query(bizCol('auditLogs'), orderBy('timestamp', 'desc'), limit(300)), s => { S.audit = s.docs.map(d => ({ id: d.id, ...d.data() })); });
}

/* ---------- issues sync ---------- */
function syncIssues(bt, inv, newIssues) {
  const now = serverTimestamp();
  const existing = new Map(S.issues.filter(i => i.transactionId === inv.id && i.auto).map(i => [i.code, i]));
  for (const is of newIssues) {
    const id = `${inv.id}__${is.code}`; const ex = existing.get(is.code); existing.delete(is.code);
    const ref = bizRef('issues', id);
    if (!ex) bt.op(b => b.set(ref, {
      auto: true, code: is.code, type: is.code, severity: is.severity, description: is.description, transactionId: inv.id,
      invoiceNumber: inv.invoiceNumber || '', invoiceType: inv.type, partyName: inv.partyName || '', period: inv.period, fy: inv.fy,
      status: 'OPEN', resolution: null, resolvedBy: null, resolvedAt: null, detectedAt: now, updatedAt: now
    }));
    else if (ex.status === 'RESOLVED') bt.op(b => b.update(ref, { status: 'OPEN', severity: is.severity, description: is.description, resolution: 'Re-opened: condition detected again', resolvedBy: null, resolvedAt: null, updatedAt: now }));
    else if (ex.description !== is.description || ex.severity !== is.severity || ex.period !== inv.period || ex.invoiceNumber !== inv.invoiceNumber)
      bt.op(b => b.update(ref, { severity: is.severity, description: is.description, period: inv.period, invoiceNumber: inv.invoiceNumber || '', updatedAt: now }));
  }
  for (const ex of existing.values()) if (['OPEN', 'UNDER_REVIEW'].includes(ex.status))
    bt.op(b => b.update(bizRef('issues', ex.id), { status: 'RESOLVED', resolution: 'Auto-resolved — condition no longer present', resolvedBy: 'System', resolvedAt: now, updatedAt: now }));
}

/* ---------- invoices ---------- */
const INPUT_FIELDS = ['type', 'docType', 'invoiceNumber', 'invoiceDate', 'partyName', 'partyGSTIN', 'placeOfSupply', 'supplierState', 'reverseCharge', 'itcCategory', 'declaredTotal', 'originalInvoiceNumber', 'notes'];
function normalizeDraft(d) {
  const inv = {};
  for (const k of INPUT_FIELDS) inv[k] = d[k] ?? '';
  inv.invoiceNumber = String(inv.invoiceNumber).trim(); inv.partyName = String(inv.partyName).trim();
  inv.partyGSTIN = String(inv.partyGSTIN).trim().toUpperCase();
  inv.reverseCharge = !!d.reverseCharge; inv.docType = inv.docType || 'INVOICE'; inv.itcCategory = inv.itcCategory || 'BUSINESS';
  inv.lines = (d.lines || []).filter(l => String(l.description || '').trim() || num(l.taxableValue) || num(l.qty))
    .map(l => clean({ description: String(l.description || '').trim(), hsn: String(l.hsn || '').trim(), qty: num(l.qty), unitPrice: num(l.unitPrice), taxableValue: round2(num(l.taxableValue)), gstRate: num(l.gstRate), cess: round2(num(l.cess)), declared: l.declared || null }));
  inv.period = inv.invoiceDate.slice(0, 7); inv.fy = inv.invoiceDate ? fyOf(inv.invoiceDate) : '';
  return inv;
}
function invoiceSnapshot(inv, ev) {
  return {
    ...inv, placeOfSupply: inv.placeOfSupply, resolvedPlaceOfSupply: ev.placeOfSupply, supplierStateResolved: ev.supplierState, interState: ev.interState,
    ...ev.totals, status: ev.status, issueCodes: ev.issues.map(i => i.code), itcStatus: ev.itcStatus, itcReason: ev.itcReason,
    reconStatus: ev.reconStatus, recon: ev.recon, engineVersion: ENGINE_VERSION, evalSig: evalSig(ev)
  };
}
/** items: [{ draft, id?, payment? }] */
async function saveInvoices(items, source, auditAction) {
  const ctx = engineCtx(); const bt = new Batcher(); const uid = S.user.uid; const saved = [];
  for (const it of items) {
    const inv = normalizeDraft(it.draft);
    const ref = it.id ? bizRef('invoices', it.id) : doc(bizCol('invoices'));
    inv.id = ref.id;
    if (inv.type === 'PURCHASE' && it.payment) {
      ctx.payments[inv.id] = it.payment;
      bt.op(b => b.set(bizRef('payments', inv.id), { ...clean(it.payment), fy: inv.fy, invoiceNumber: inv.invoiceNumber, updatedBy: uid, updatedAt: serverTimestamp() }));
    }
    const ev = evaluateInvoice(inv, ctx);
    const data = clean(invoiceSnapshot(inv, ev)); delete data.id;
    data.source = it.id ? (S.invoices.find(x => x.id === it.id)?.source || source) : source;
    data.updatedAt = serverTimestamp(); data.updatedBy = uid;
    if (!it.id) { data.createdAt = serverTimestamp(); data.createdBy = uid; }
    bt.op(b => b.set(ref, data, { merge: true }));
    syncIssues(bt, inv, ev.issues);
    ctx.invoices = ctx.invoices.filter(x => x.id !== inv.id).concat([{ ...inv }]);
    saved.push({ ...inv, ev });
  }
  if (auditAction) bt.op(b => auditIn(b, auditAction.action, 'invoice', auditAction.entityId || saved[0]?.id, auditAction.meta || {}));
  await bt.commit();
  return saved;
}
async function deleteInvoice(id) {
  const inv = S.invoices.find(i => i.id === id); if (!inv) return;
  const bt = new Batcher(); const now = serverTimestamp();
  bt.op(b => b.delete(bizRef('invoices', id)));
  for (const is of S.issues.filter(i => i.transactionId === id && ['OPEN', 'UNDER_REVIEW'].includes(i.status)))
    bt.op(b => b.update(bizRef('issues', is.id), { status: 'RESOLVED', resolution: 'Invoice deleted', resolvedBy: 'System', resolvedAt: now, updatedAt: now }));
  bt.op(b => auditIn(b, 'INVOICE_DELETED', 'invoice', id, { invoiceNumber: inv.invoiceNumber, type: inv.type, total: inv.totalAmount }));
  await bt.commit();
}
/** Re-evaluate every invoice of the FY; updates open-period snapshots and syncs issues everywhere. */
async function runChecks(ctxExtra = {}, silent = false) {
  const ctx = engineCtx(ctxExtra); const bt = new Batcher(); let changed = 0;
  for (const inv of S.invoices) {
    const ev = evaluateInvoice(inv, ctx);
    if (!isLocked(inv.period) && can('write') && evalSig(ev) !== inv.evalSig) {
      const snap = clean(invoiceSnapshot(normalizeDraft(inv), ev)); delete snap.id;
      bt.op(b => b.update(bizRef('invoices', inv.id), { ...snap, updatedAt: serverTimestamp() })); changed++;
    }
    syncIssues(bt, inv, ev.issues);
  }
  if (bt.n || bt.all.length) bt.op(b => auditIn(b, 'CHECKS_RUN', 'business', S.biz.id, { invoices: S.invoices.length, updated: changed, engineVersion: ENGINE_VERSION }));
  await bt.commit();
  if (!silent) toast(`Checks complete — ${S.invoices.length} invoices evaluated.`);
}

function readBizForm(f) {

async function approveReturn() {
  const p = S.period; const checks = returnChecks(p);
  if (checks.some(c => c.blocking && !c.ok)) return toast('Resolve high-severity issues first.', 'err');
  const warn = checks.filter(c => !c.ok);
  if (!confirm(`Approve the ${periodLabel(p)} return?\n\n${warn.length ? 'Warnings:\n' + warn.map(w => '• ' + w.label + (w.detail ? ' — ' + w.detail : '')).join('\n') + '\n\n' : ''}Approving locks all invoices of this period.`)) return;
  const g3 = gstr3b(p), g1 = gstr1(p);
  const b = writeBatch(db); const who = S.user.displayName || S.user.email;
  const data = { status: 'APPROVED', period: p, fy: S.fy, approvedBy: S.user.uid, approvedByName: who, approvedAt: serverTimestamp(), engineVersion: ENGINE_VERSION, summary: clean({ gstr3b: g3, gstr1: g1 }), updatedAt: serverTimestamp() };
  b.set(bizRef('periods', p), data, { merge: true });
  auditIn(b, 'RETURN_APPROVED', 'period', p, { period: p, outputTax: g3.outputTax, itc: g3.itcSum, cashPayable: g3.cash.total, warnings: warn.map(w => w.label) });
  try { await b.commit(); toast(`${periodLabel(p)} approved and locked.`); } catch (e) { toast(friendly(e), 'err'); }
}
async function markFiled() {
  const p = S.period; const arn = prompt('Enter the ARN (Acknowledgement Reference Number) from the GST portal:'); if (arn === null) return;
  if (!arn.trim()) return toast('ARN is required.', 'err');
  const filedDate = prompt('Filing date (DD-MM-YYYY):', fmtDate(todayISO())); const fd = parseDate(filedDate); if (!fd) return toast('Invalid date.', 'err');
  const b = writeBatch(db);
  b.update(bizRef('periods', p), { status: 'FILED', arn: arn.trim(), filedDate: fd, filedBy: S.user.uid, updatedAt: serverTimestamp() });
  auditIn(b, 'RETURN_FILED', 'period', p, { period: p, arn: arn.trim(), filedDate: fd });
  try { await b.commit(); toast(`${periodLabel(p)} recorded as filed.`); } catch (e) { toast(friendly(e), 'err'); }
}
async function unlockReturn() {
  const p = S.period; const reason = prompt(`Why unlock ${periodLabel(p)}? (recorded in the audit trail)`); if (!reason) return;
  const b = writeBatch(db);
  b.update(bizRef('periods', p), { status: 'OPEN', unlockedBy: S.user.uid, unlockReason: reason, unlockedAt: serverTimestamp(), updatedAt: serverTimestamp() });
  auditIn(b, 'RETURN_UNLOCKED', 'period', p, { period: p, reason });
  try { await b.commit(); toast(`${periodLabel(p)} unlocked.`); } catch (e) { toast(friendly(e), 'err'); }
}

  'ai-read': el => runAIRead(el),
  'ai-ask': el => aiAsk(el.dataset.q),
  'ai-reset': () => { S.chat = null; render(); },
  'ai-open': el => openChat(el.dataset.id),
  'ai-delete': el => deleteChat(el.dataset.id),
  'import-template': el => importTemplate(el.dataset.type),
  'do-import': async el => {
    const pv = S.importPreview; if (!pv?.items.length) return; el.disabled = true; el.textContent = 'Importing…';
    try {
      const saved = await saveInvoices(pv.items.map(it => ({ draft: it.draft, payment: it.payment })), 'import', { action: 'INVOICES_IMPORTED', entityId: null, meta: { type: pv.type, invoices: pv.items.length } });
      closeModal(); toast(`Imported ${saved.length} documents — ${saved.filter(s => s.ev.status === 'HAS_ISSUES').length} with issues.`);
    } catch (e) { console.error(e); toast(friendly(e), 'err'); el.disabled = false; el.textContent = 'Import'; }
  },
  'export-invoices': el => {
    const type = el.dataset.type; const rows = [['type', 'docType', 'invoiceNumber', 'invoiceDate', 'period', 'partyName', 'partyGSTIN', 'placeOfSupply', 'reverseCharge', 'description', 'hsn', 'qty', 'unitPrice', 'taxableValue', 'gstRate', 'cgst', 'sgst', 'igst', 'cess', 'invoiceTotal', 'checks', 'itcStatus', 'reconStatus']];
    for (const i of filteredInvoices(type)) { const ev = S.evals.get(i.id); ev.lines.forEach(l => rows.push([i.type, i.docType, i.invoiceNumber, i.invoiceDate, i.period, i.partyName, i.partyGSTIN, ev.placeOfSupply, i.reverseCharge ? 'Y' : 'N', l.description, l.hsn, l.qty, l.unitPrice, l.taxableValue, l.gstRate, l.cgst, l.sgst, l.igst, l.cess, ev.totals.totalAmount, ev.status, ev.itcStatus || '', ev.reconStatus || ''])); }
    download(`taxpilot-${type.toLowerCase()}-${S.fy}.csv`, toCSV(rows), 'text/csv');
  },
  'run-checks': async el => { el.disabled = true; try { await runChecks(); } catch (e) { toast(friendly(e), 'err'); } el.disabled = false; },
  'issue-status': async el => { try { await setIssueStatus(el.dataset.id, el.dataset.st); } catch (e) { toast(friendly(e), 'err'); } },
  'import-2b': () => open2BImport(),
  'do-2b': () => do2BImport(),
  'add-from-2b': el => {
    const r = S.gstr2b.find(x => x.id === el.dataset.id); if (!r) return;
    const tax = num(r.igst) + num(r.cgst) + num(r.sgst); const raw = r.taxableValue ? tax / r.taxableValue * 100 : 18;
    const slab = rateSlab(r.invoiceDate || todayISO()); const rate = slab.rates.reduce((a, b) => Math.abs(b - raw) < Math.abs(a - raw) ? b : a, 18);
    openInvoice('PURCHASE', null, { docType: r.docType, invoiceNumber: r.invoiceNumber, invoiceDate: r.invoiceDate || `${r.period}-01`, partyName: r.supplierName, partyGSTIN: r.supplierGSTIN, declaredTotal: r.invoiceValue || '',
      lines: [{ description: '', hsn: '', qty: '', unitPrice: '', taxableValue: r.taxableValue, gstRate: rate, cess: r.cess || '', _manual: true }] });
  },
  'mark-paid': async el => {
    const inv = S.invoices.find(i => i.id === el.dataset.id); const d = prompt(`Payment date for ${inv.invoiceNumber} (DD-MM-YYYY):`, fmtDate(todayISO())); if (d === null) return;
    const iso = parseDate(d); if (!iso) return toast('Invalid date.', 'err');
    try { await recordPayment(inv, 'PAID', iso); } catch (e) { toast(friendly(e), 'err'); }
  },
  'tab': el => { S.f[el.dataset.k] = el.dataset.v; render(); },
  'approve-return': () => approveReturn(),
  'mark-filed': () => markFiled(),
  'unlock-return': () => unlockReturn(),
  'print': () => window.print(),
  'export-return': () => {
    const p = S.period; const per = S.periods[p]; const locked = isLocked(p) && per.summary;
    download(`taxpilot-return-${S.biz.gstin}-${p}.json`, JSON.stringify({ gstin: S.biz.gstin, legalName: S.biz.legalName || S.biz.name, period: p, status: per?.status || 'OPEN', arn: per?.arn || null,
      engineVersion: locked ? per.engineVersion : ENGINE_VERSION, generatedAt: new Date().toISOString(), gstr3b: locked ? per.summary.gstr3b : gstr3b(p), gstr1: locked ? per.summary.gstr1 : gstr1(p) }, null, 2), 'application/json');
    audit('RETURN_EXPORTED', 'period', p, { period: p });
  },
  'export-gstr1-govt': () => {
    const p = S.period;
    const gov = buildGstr1GovtJson(p);
    download(`gstr1-${S.biz.gstin}-${gov.fp}.json`, JSON.stringify(gov, null, 2), 'application/json');
    audit('RETURN_EXPORTED_GOVT_FORMAT', 'period', p, { period: p });
    toast('Downloaded. Upload this file into the GST portal\'s "Returns Offline Tool" — it will validate it before you file.');
  },
  'accept-invite': async el => {
    const snap = await getDoc(doc(db, 'businesses', el.dataset.id)); const b = snap.data(); const email = S.user.email.toLowerCase(); const uid = S.user.uid;
    const invites = { ...b.invites }; delete invites[email];
    try {
      await updateDoc(snap.ref, { memberIds: [...b.memberIds, uid], roles: { ...b.roles, [uid]: b.invites[email] }, memberInfo: { ...(b.memberInfo || {}), [uid]: { name: S.user.displayName || '', email } },
        invites, inviteEmails: b.inviteEmails.filter(e => e !== email), updatedAt: serverTimestamp() });
      await addDoc(collection(db, 'businesses', snap.id, 'auditLogs'), auditData('MEMBER_JOINED', 'member', uid, { email, role: b.invites[email] }));
      toast(`You joined ${b.name}.`); await loadBusinesses(); await selectBusiness(snap.id); location.hash = '#/dashboard'; render();
    } catch (e) { toast(friendly(e), 'err'); }
  },
  'decline-invite': async el => {
    const snap = await getDoc(doc(db, 'businesses', el.dataset.id)); const b = snap.data(); const email = S.user.email.toLowerCase();
    const invites = { ...b.invites }; delete invites[email];
    try { await updateDoc(snap.ref, { invites, inviteEmails: b.inviteEmails.filter(e => e !== email), updatedAt: serverTimestamp() }); S.invites = S.invites.filter(x => x.id !== snap.id); render(); } catch (e) { toast(friendly(e), 'err'); }
  },
  'remove-member': async el => {
    const uid = el.dataset.uid; const m = S.biz.memberInfo?.[uid] || {}; if (!confirm(`Remove ${m.name || m.email} from ${S.biz.name}?`)) return;
    await teamUpdate(n => { n.memberIds = n.memberIds.filter(x => x !== uid); delete n.roles[uid]; delete n.memberInfo[uid]; return n; }, ['MEMBER_REMOVED', 'member', uid, { email: m.email }]);
    toast('Member removed.');
  },
  'cancel-invite': async el => { const e = el.dataset.email; await teamUpdate(n => { delete n.invites[e]; return n; }, ['INVITE_CANCELLED', 'member', null, { email: e }]); toast('Invitation cancelled.'); },
  'copy-rules': async () => { try { await navigator.clipboard.writeText($('#fs-rules').textContent); toast('Rules copied — paste them in Firestore → Rules and click Publish.'); } catch { toast('Copy failed — select the text manually.', 'err'); } }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'A') e.preventDefault();
  const fn = actions[el.dataset.act]; if (fn) Promise.resolve(fn(el, e)).catch(err => { console.error(err); toast(friendly(err), 'err'); });
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.filter === 'q') { S.f.q = el.value; const tb = $('#inv-tbody'); if (tb) tb.innerHTML = invoiceRows(tb.dataset.type); return; }
  if (el.closest('form[data-form="update-business"]')) S.formDirty = true;
  if (el.hasAttribute('data-gstin-auto')) {
    const g = validateGSTIN(el.value); const f = el.form; const h = $('#gstin-hint');
    if (g.ok) { f.pan.value = g.pan; f.stateCode.value = g.stateCode; h.className = 'hint ok'; h.textContent = `✓ Valid GSTIN · ${g.state} · PAN ${g.pan}`; }
    else { h.className = el.value ? 'hint bad' : 'hint'; h.textContent = el.value ? `GSTIN ${g.error}` : '15 characters — state and PAN are filled automatically'; }
  }
  if (S.draft && (el.dataset.d || el.dataset.l)) onDraftInput(el, false);
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (S.draft && (el.dataset.d || el.dataset.l)) return onDraftInput(el, true);
  if (el.dataset.filter && el.dataset.filter !== 'q') { S.f[el.dataset.filter] = el.value; render(); return; }
  if (el.dataset.file === 'ai-invoice') {
    const file = el.files[0]; const btn = $('[data-act="ai-read"]'); const st = $('#ai-status');
    S.aiFile = null; btn.disabled = true; st.innerHTML = '';
    if (!file) return;
    if (!/^(application\/pdf|image\/(png|jpeg|webp))$/.test(file.type)) { st.innerHTML = '<div class="notice bad">Please choose a PDF, JPG, PNG or WEBP file.</div>'; return; }
    if (file.size > 15 * 1024 * 1024) { st.innerHTML = '<div class="notice bad">File is larger than 15 MB.</div>'; return; }
    S.aiFile = file; btn.disabled = false; st.innerHTML = `<div class="small muted">${esc(file.name)} · ${(file.size / 1024).toFixed(0)} KB</div>`;
    return;
  }
  if (el.dataset.file === 'import') {
    const file = el.files[0]; if (!file) return; const box = $('#import-preview'); box.innerHTML = '<div class="spin"></div>';
    try {
      const rows = await readSheet(file); const r = buildImport(rows, S.importPreview.type); S.importPreview = { ...S.importPreview, ...r };
      const ctx = engineCtx(); let issues = 0;
      for (const it of r.items) { const inv = normalizeDraft(it.draft); inv.id = '__imp' + Math.random(); const ev = evaluateInvoice(inv, ctx); ctx.invoices.push(inv); if (ev.status === 'HAS_ISSUES') issues++; }
      box.innerHTML = `<div class="notice ${r.items.length ? 'ok' : 'warn'}">${r.items.length} document(s) ready from ${rows.length} row(s)${issues ? ` · ${issues} will be flagged with issues` : ''}.</div>`
        + (r.errors.length ? `<div class="notice bad"><b>${r.errors.length} row(s) skipped:</b><br>${r.errors.slice(0, 12).map(esc).join('<br>')}${r.errors.length > 12 ? '<br>…' : ''}</div>` : '');
      $('[data-act="do-import"]').disabled = !r.items.length;
    } catch (err) { box.innerHTML = `<div class="notice bad">${esc(err.message)}</div>`; }
    return;
  }
  if (el.dataset.file === '2b') {
    const file = el.files[0]; if (!file) return; const box = $('#twob-preview');
    try {
      let pv;
      if (/\.json$/i.test(file.name)) pv = parse2B(JSON.parse(await file.text()));
      else pv = { period: null, rows: parse2BRows(await readSheet(file)) };
      const bad = pv.rows.filter(r => !validateGSTIN(r.supplierGSTIN).ok || !r.invoiceNumber).length;
      pv.rows = pv.rows.filter(r => r.invoiceNumber);
      S.twoBPreview = pv;
      if (pv.period) $('#twob-period').value = pv.period;
      box.innerHTML = `<div class="notice ${pv.rows.length ? 'ok' : 'warn'}">${pv.rows.length} document(s) found${pv.period ? ` for ${periodLabel(pv.period)}` : ''} · ${pv.rows.filter(r => r.docType === 'INVOICE').length} invoices, ${pv.rows.filter(r => r.docType !== 'INVOICE').length} notes${bad ? ` · ${bad} with an invalid GSTIN` : ''}.</div>`;
      $('[data-act="do-2b"]').disabled = !pv.rows.length;
    } catch (err) { box.innerHTML = `<div class="notice bad">Could not read file: ${esc(err.message)}</div>`; }
    return;
  }
  if (el.dataset.change === 'biz') {
    if (el.value === '__new') { location.hash = '#/onboarding'; return; }
    S.f.month = 'CUR'; await selectBusiness(el.value); render(); return;
  }
  if (el.dataset.change === 'fy') { S.fy = el.value; S.period = defaultPeriod(S.fy); unsubAll(); Object.assign(S, { invoices: [], issues: [], gstr2b: [], payments: {} }); subscribe(); render(); return; }
  if (el.dataset.change === 'period') { S.period = el.value; render(); return; }
  if (el.dataset.change === 'member-role') {
    const uid = el.dataset.uid; const from = S.biz.roles[uid];
    try { await teamUpdate(n => { n.roles[uid] = el.value; return n; }, ['ROLE_CHANGED', 'member', uid, { from, to: el.value }]); toast('Role updated.'); } catch { render(); }
  }
});
function onDraftInput(el, isChange) {
  const d = S.draft;
  if (el.dataset.d) {
    const k = el.dataset.d; d[k] = el.type === 'checkbox' ? el.checked : el.value;
    if (k === 'partyGSTIN') {
      const g = validateGSTIN(el.value); const h = $('#party-hint');
      if (h) { h.className = 'hint ' + (g.ok ? 'ok' : el.value ? 'bad' : ''); h.textContent = g.ok ? '✓ ' + g.state : el.value ? g.error : ''; }
    }
    if (isChange && ['docType', 'invoiceDate', 'paymentStatus'].includes(k)) { renderInvoiceModal(); return; }
  } else {
    const [i, k] = el.dataset.l.split(':'); const l = d.lines[+i]; l[k] = el.value;
    if (k === 'taxableValue') l._manual = el.value !== '';
    if ((k === 'qty' || k === 'unitPrice') && !l._manual) {
      const v = num(l.qty) * num(l.unitPrice); l.taxableValue = v ? round2(v) : '';
      const inp = $(`[data-l="${i}:taxableValue"]`); if (inp) inp.value = l.taxableValue;
    }
  }
  updateInvoicePreview();
}
document.addEventListener('submit', async e => {
  const f = e.target; const kind = f.dataset.form; if (!kind) return; e.preventDefault();
  if (kind === 'ai-chat') { const q = f.q.value; f.q.value = ''; return aiAsk(q); }
  const btn = f.querySelector('button:not([type=button])'); const label = btn?.textContent;
  const busy = on => { if (btn) { btn.disabled = on; btn.textContent = on ? 'Please wait…' : label; } };
  const fd = Object.fromEntries(new FormData(f).entries());
  busy(true);
  try {
    if (kind === 'login') { await signInWithEmailAndPassword(auth, fd.email.trim(), fd.password); }
    else if (kind === 'signup') {
      if (fd.password !== fd.password2) throw new Error('Passwords do not match.');
      const cred = await createUserWithEmailAndPassword(auth, fd.email.trim(), fd.password);
      await updateProfile(cred.user, { displayName: fd.name.trim() });
      await setDoc(doc(db, 'users', cred.user.uid), { uid: cred.user.uid, name: fd.name.trim(), email: cred.user.email, activeBusinessId: null, createdAt: serverTimestamp(), updatedAt: serverTimestamp() }, { merge: true });
      sendEmailVerification(cred.user).catch(() => { });
      S.user = auth.currentUser; S.profile = { name: fd.name.trim() }; render();
    }
    else if (kind === 'reset') { await sendPasswordResetEmail(auth, fd.email.trim()); authMsg('If an account exists for this email, a reset link has been sent.', 'ok'); }
    else if (kind === 'create-business') {
      const d = readBizForm(f); const uid = S.user.uid; const ref = doc(collection(db, 'businesses'));
      const b = writeBatch(db);
      b.set(ref, { ...d, createdBy: uid, memberIds: [uid], roles: { [uid]: 'OWNER' }, memberInfo: { [uid]: { name: S.user.displayName || '', email: S.user.email.toLowerCase() } },
        invites: {}, inviteEmails: [], createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
      b.set(doc(db, 'users', uid), { activeBusinessId: ref.id, updatedAt: serverTimestamp() }, { merge: true });
      await b.commit();
      await addDoc(collection(db, 'businesses', ref.id, 'auditLogs'), auditData('BUSINESS_CREATED', 'business', ref.id, { name: d.name, gstin: d.gstin }));
      S.fy = d.financialYear || fyOf(todayISO());
      await loadBusinesses(); await selectBusiness(ref.id); S.bootError = '';
      toast(`${d.name} created.`); location.hash = '#/dashboard'; render();
    }
    else if (kind === 'update-business') {
      const d = readBizForm(f); const b = writeBatch(db);
      const changedKeys = Object.keys(d).filter(k => d[k] !== (S.biz[k] ?? ''));
      b.update(bizRef(), { ...d, updatedAt: serverTimestamp() });
      auditIn(b, 'BUSINESS_UPDATED', 'business', S.biz.id, { changed: changedKeys });
      await b.commit(); S.formDirty = false; toast('Business profile saved.');
      if (changedKeys.some(k => ['stateCode', 'registrationType', 'gstin'].includes(k)) && can('write')) await runChecks({ biz: { ...S.biz, ...d } }, true);
      render();
    }
    else if (kind === 'change-email' || kind === 'change-password') {
      const u = auth.currentUser;
      await reauthenticateWithCredential(u, EmailAuthProvider.credential(u.email, fd.password));
      if (kind === 'change-email') {
        const ne = fd.newEmail.trim().toLowerCase();
        if (ne === u.email.toLowerCase()) throw new Error('That is already your email.');
        await verifyBeforeUpdateEmail(u, ne);
        audit('EMAIL_CHANGE_REQUESTED', 'user', u.uid, { from: u.email, to: ne });
        toast(`Verification link sent to ${ne}. Click it, then sign in again with the new email.`);
      } else {
        await updatePassword(u, fd.newPassword);
        audit('PASSWORD_CHANGED', 'user', u.uid, {});
        toast('Password updated.');
      }
      f.reset();
    }
    else if (kind === 'invite') {
      const email = fd.email.trim().toLowerCase(); const role = fd.role;
      if (Object.values(S.biz.memberInfo || {}).some(m => m.email === email)) throw new Error('This person is already a member.');
      await teamUpdate(n => { n.invites[email] = role; return n; }, ['MEMBER_INVITED', 'member', null, { email, role }]);
      toast(`Invitation recorded for ${email}. Ask them to sign up with this email.`); f.reset();
    }
  } catch (err) {
    console.error(err);
    if (['login', 'signup', 'reset'].includes(kind)) authMsg(friendly(err)); else toast(friendly(err), 'err');
  } finally { busy(false); }
});
window.addEventListener('hashchange', () => { S.formDirty = false; S.navOpen = false; if (!S.draft) closeModal(); render(); });

/* =====================================================================
   BOOT
   ===================================================================== */
const withTimeout = (p, ms, msg) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(msg)), ms))]);
const BOOT_TIMEOUT_MSG = location.protocol === 'file:'
  ? 'The database cannot be reached because this file was opened directly (file://). Open it through a web server instead, e.g. http://localhost:5510/taxpilot-ai.html.'
  : 'The Firestore database is not responding. Make sure it has been created in Firebase Console → Firestore Database, and check your internet connection.';
onAuthStateChanged(auth, async user => {
  unsubAll(); S.authReady = true; S.user = user; S.biz = null; S.businesses = []; S.invites = []; S.bootError = ''; S.fy = null; S.chat = null; S.chatList = null;
  if (!user) { if (!['', 'login', 'signup', 'reset'].includes(route())) location.hash = '#/'; render(); return; }
  S.booting = true; render();
  try {
    await withTimeout((async () => { await ensureProfile(); await loadBusinesses(); })(), 15000, BOOT_TIMEOUT_MSG);
    const pick = (S.profile?.activeBusinessId && S.businesses.find(b => b.id === S.profile.activeBusinessId)) || S.businesses[0];
    if (pick) await selectBusiness(pick.id);
  } catch (e) { console.error(e); S.bootError = friendly(e); }
  S.booting = false;
  if (['', 'login', 'signup', 'reset'].includes(route())) location.hash = S.biz ? '#/dashboard' : '#/onboarding';
  render();
});
render();

// expose the pure engine for automated tests
window.TaxPilotEngine = { validateGSTIN, gstinCheckChar, evaluateInvoice, setOff, fyOf, fyMonths, parseDate, rateSlab, parse2B };
</script>
</body>
</html>
